name: Link Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --include-fragments
            --root-dir "$(pwd)"
            --accept 200..=299,429
            --exclude-path '(^|/)\.git(/|$)'
            --exclude-path '(^|/)node_modules(/|$)'
            --exclude-path '(^|/)vendor(/|$)'
            --exclude-path '(^|/)\.obsidian(/|$)'
            './**/*.md'
          fail: true
          failIfEmpty: false
          token: ${{ secrets.GITHUB_TOKEN }}
